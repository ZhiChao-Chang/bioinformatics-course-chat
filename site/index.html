<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="《生物信息学与计算生物学》课程问答助手">
  <meta name="referrer" content="no-referrer">
  <title>生物信息学与计算生物学 · 课程问答</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="课程导航">
    <div class="brand"><span class="brand-mark" aria-hidden="true">B<span>.</span></span><div>生物信息学<span class="brand-sub">与计算生物学</span></div></div>
    <button class="new-chat" id="new-chat"><span aria-hidden="true">＋</span> 新建对话</button>
    <div class="history-area"><h2>最近对话</h2><nav id="history" aria-label="最近对话"></nav></div>
    <div class="sidebar-footer">
      <button id="clear-history" class="quiet">清除本地对话</button>
      <p>对话记录保存在当前浏览器。</p>
    </div>
  </aside>
  <div id="scrim" hidden></div>
  <main>
    <header>
      <div class="header-start"><button id="menu" class="quiet" aria-controls="sidebar" aria-expanded="false">菜单</button><strong>课程问答</strong></div>
      <div class="header-end"><span class="badge" id="mode">示例预览</span><button class="quiet" id="access" hidden>课堂访问码</button></div>
    </header>
    <div class="workspace" id="workspace">
      <section id="welcome" class="welcome">
        <div class="hero">
          <div class="hero-art" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="hero-copy">
            <p class="eyebrow">课程学习助手</p>
            <h1>生物信息学<br class="hero-break">与计算生物学</h1>
            <p class="intro">从序列、数据和算法出发，把课上的问题一步一步弄明白。</p>
          </div>
        </div>
        <div class="examples">
          <h2>从一个问题开始</h2>
          <div class="example-grid" id="examples"></div>
        </div>
      </section>
      <section id="messages" aria-label="对话" hidden></section>
    </div>
    <div class="dock">
      <div class="dock-inner">
        <p id="notice" class="notice" role="status"></p>
        <form class="composer" id="composer">
          <label class="sr-only" for="prompt">你的课程问题</label>
          <textarea id="prompt" rows="1" maxlength="3000" placeholder="输入一个课程问题…" required></textarea>
          <button class="send" id="send" type="submit">发送</button>
          <button class="stop" id="stop" type="button" hidden>停止</button>
        </form>
        <p class="composer-note" id="composer-note">Enter 发送 · Shift + Enter 换行</p>
      </div>
    </div>
  </main>
  <dialog id="access-dialog">
    <form id="access-form">
      <h2>输入课堂访问码</h2>
      <p>访问码由课程组织者提供。</p>
      <label for="access-code">课堂访问码</label>
      <input id="access-code" type="password" autocomplete="off" required maxlength="128">
      <div class="dialog-buttons"><button class="quiet" id="cancel-access" type="button">取消</button><button class="send" type="submit">确认</button></div>
    </form>
  </dialog>
</body>
</html>
